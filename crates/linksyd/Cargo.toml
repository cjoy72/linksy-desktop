[package]
name = "linksyd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
linksy-logs = { path = "../linksy-logs" }
linksy-core = { path = "../linksy-core", default-features = false }
linksy-ipc = { path = "../linksy-ipc" }
linksy-i18n = { path = "../linksy-i18n" }
linksy-host = { path = "../linksy-host" }
# X11: hearing when the clipboard changes (XFixes)
x11rb = { version = "0.13.2", features = ["xfixes"] }
serde ={ version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"] }
argon2 = "0.5.3"
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18.2"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }
futures-util = { version = "0.3.34", default-features = false }
nusb = { version = "0.2.8", features = ["tokio"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
if-addrs = "0.15.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
if-addrs = "0.15.0"
# The tray icon and its menu; the file dialog for Send Files; the QR code for pairing
tray-icon = "0.21.3"
rfd = "0.15.4"
qrcode = { version = "0.14.1", default-features = false }
# Toast notifications, with buttons
tauri-winrt-notification = "0.8.1"
# The clipboard: text, pictures and files
clipboard-win = "5.4.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }

[features]
default = ["away"]
# `--no-default-features`: a service with no relay code, that never reaches past the local
# network and the cable (ROADMAP 0.14)
away = ["linksy-core/away"]

[build-dependencies]
winresource = "0.1.20"

[dev-dependencies]
tempfile = "3.27.0"
